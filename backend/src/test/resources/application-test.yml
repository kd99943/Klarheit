spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  payment:
    mock-enabled: true
  jwt:
    secret: ${APP_JWT_SECRET:test-secret-key-change-me-minimum-32-characters-long}
    expiration-millis: 86400000
