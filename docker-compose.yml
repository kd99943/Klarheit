version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: klarheit-db
    restart: always
    environment:
      MYSQL_DATABASE: klarheit
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_password}
      MYSQL_USER: klarheit_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app_password}
    ports:
      - "3306:3306"
    volumes:
      - db_volume_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-changeme_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klarheit-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/klarheit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=klarheit_app
      - DB_PASSWORD=${MYSQL_PASSWORD:-changeme_app_password}
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/klarheit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=klarheit_app
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-changeme_app_password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost}
      - APP_BACKEND_BASE_URL=${APP_BACKEND_BASE_URL:-http://localhost:8080}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-orders@klarheit.com}
      - PAYMENT_MOCK_ENABLED=${PAYMENT_MOCK_ENABLED:-false}
      - PAYMENT_CALLBACK_SECRET=${PAYMENT_CALLBACK_SECRET:-}
      - PAYMENT_WEBHOOK_IP_WHITELIST=${PAYMENT_WEBHOOK_IP_WHITELIST:-}
      - PAYMENT_WEBHOOK_TRUST_FORWARDED_FOR=${PAYMENT_WEBHOOK_TRUST_FORWARDED_FOR:-false}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID:-}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY:-}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY:-}
      - ALIPAY_GATEWAY_URL=${ALIPAY_GATEWAY_URL:-${ALIPAY_GATEWAY:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}}
      - ALIPAY_NOTIFY_URL=${ALIPAY_NOTIFY_URL:-}
      - ALIPAY_RETURN_URL=${ALIPAY_RETURN_URL:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
      args:
        # Production API base URL baked into frontend JS at build time.
        # Must be the full URL browsers use to reach the backend API, e.g. https://api.klarheit.com/api/v1
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: klarheit-web
    restart: always
    ports:
      - "80:80"
    environment:
      # Browser-facing backend origin for CSP connect-src and runtime env-config.js injection.
      # Must match the URL browsers use to reach the backend (not the Docker internal hostname).
      - API_ORIGIN=${API_ORIGIN:-http://localhost:8080}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend

volumes:
  db_volume_data:
